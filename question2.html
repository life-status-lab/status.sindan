<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STATUS診断 - Q11〜20</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFE54C;
      --pink:   #FF6BB5;
      --blue:   #4CC9FF;
      --green:  #4CFFA0;
      --orange: #FF8C42;
      --purple: #C97BFF;
      --bg:     #FFF8EC;
      --ink:    #1A1A2E;
      --card:   #FFFFFF;
      --border: 3px solid var(--ink);
      --shadow: 5px 5px 0px var(--ink);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, #FFE54C44 1px, transparent 1px),
        radial-gradient(circle, #FF6BB522 1px, transparent 1px);
      background-size: 32px 32px, 16px 16px;
      background-position: 0 0, 8px 8px;
      font-family: 'Zen Maru Gothic', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .progress-wrap {
      max-width: 480px;
      margin: 0 auto 24px;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .progress-label .pg-title {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 13px;
    }
    .progress-label .pg-num {
      font-size: 12px;
      font-weight: 700;
      background: var(--ink);
      color: var(--yellow);
      padding: 2px 10px;
      border-radius: 99px;
    }
    .progress-track {
      height: 10px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 66%;
      background: linear-gradient(90deg, var(--pink), var(--orange));
      border-radius: 99px;
    }

    .q-card {
      max-width: 480px;
      margin: 0 auto 20px;
      background: var(--card);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: popIn .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    .q-card:nth-child(2)  { animation-delay: .02s; }
    .q-card:nth-child(3)  { animation-delay: .04s; }
    .q-card:nth-child(4)  { animation-delay: .06s; }
    .q-card:nth-child(5)  { animation-delay: .08s; }
    .q-card:nth-child(6)  { animation-delay: .10s; }
    .q-card:nth-child(7)  { animation-delay: .12s; }
    .q-card:nth-child(8)  { animation-delay: .14s; }
    .q-card:nth-child(9)  { animation-delay: .16s; }
    .q-card:nth-child(10) { animation-delay: .18s; }

    .q-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: var(--border);
      background: var(--blue);
    }
    .q-num {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }
    .q-text {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .q-choices {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 16px;
      background: var(--bg);
      border: 2px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s, background .1s;
      box-shadow: 3px 3px 0 var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice-btn .choice-label {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 12px;
      background: var(--ink);
      color: var(--yellow);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .choice-btn:hover {
      background: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .choice-btn.selected {
      background: var(--blue);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .choice-btn.selected .choice-label {
      background: var(--ink);
      color: var(--blue);
    }

    .next-wrap {
      max-width: 480px;
      margin: 8px auto 0;
      animation: popIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    .next-btn {
      display: block;
      width: 100%;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 17px;
      text-align: center;
      padding: 15px;
      background: var(--pink);
      color: #fff;
      border: var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
    }
    .next-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      text-decoration: underline;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.88) translateY(16px); }
      to   { opacity: 1; transform: scale(1)   translateY(0);    }
    }
  </style>
</head>
<body>

  <div class="progress-wrap">
    <div class="progress-label">
      <span class="pg-title">✦ PART 2 / 3</span>
      <span class="pg-num">Q11〜20</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- Q11 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q11</span>
      <span class="q-text">休日の過ごし方</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q11" onclick="q11('a', this)"><span class="choice-label">A</span>予定パンパン！朝から晩まで外出</button>
      <button class="choice-btn q11" onclick="q11('b', this)"><span class="choice-label">B</span>趣味や遊びを全力でエンジョイ</button>
      <button class="choice-btn q11" onclick="q11('c', this)"><span class="choice-label">C</span>動画やゲームでゆっくり</button>
      <button class="choice-btn q11" onclick="q11('d', this)"><span class="choice-label">D</span>スマホ見てたら日が暮れる</button>
      <button class="choice-btn q11" onclick="q11('e', this)"><span class="choice-label">E</span>気づいたら一日が消滅している</button>
    </div>
  </div>

  <!-- Q12 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q12</span>
      <span class="q-text">新しいことへの挑戦</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q12" onclick="q12('a', this)"><span class="choice-label">A</span>気になった瞬間に飛び込む！</button>
      <button class="choice-btn q12" onclick="q12('b', this)"><span class="choice-label">B</span>念入りに調べてからスタート</button>
      <button class="choice-btn q12" onclick="q12('c', this)"><span class="choice-label">C</span>誰かに誘われたら乗ってみる</button>
      <button class="choice-btn q12" onclick="q12('d', this)"><span class="choice-label">D</span>興味はあるけど「いつか」で終わる</button>
      <button class="choice-btn q12" onclick="q12('e', this)"><span class="choice-label">E</span>失敗が怖くて、結局やらない</button>
    </div>
  </div>

  <!-- Q13 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q13</span>
      <span class="q-text">SNSとの距離感</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q13" onclick="q13('a', this)"><span class="choice-label">A</span>投稿も交流もガンガンする派</button>
      <button class="choice-btn q13" onclick="q13('b', this)"><span class="choice-label">B</span>流行を追うために普通に使う</button>
      <button class="choice-btn q13" onclick="q13('c', this)"><span class="choice-label">C</span>基本「見る専」でひっそり楽しむ</button>
      <button class="choice-btn q13" onclick="q13('d', this)"><span class="choice-label">D</span>無意識にずっと眺めてしまう</button>
      <button class="choice-btn q13" onclick="q13('e', this)"><span class="choice-label">E</span>SNS疲れを感じて距離を置く</button>
    </div>
  </div>

  <!-- Q14 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q14</span>
      <span class="q-text">失敗したとき</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q14" onclick="q14('a', this)"><span class="choice-label">A</span>「いい経験！」と即座に切り替える</button>
      <button class="choice-btn q14" onclick="q14('b', this)"><span class="choice-label">B</span>少し落ち込んでから、次に活かす</button>
      <button class="choice-btn q14" onclick="q14('c', this)"><span class="choice-label">C</span>「まあいっか」と受け流す</button>
      <button class="choice-btn q14" onclick="q14('d', this)"><span class="choice-label">D</span>「あぁ...」と数日間は引きずる</button>
      <button class="choice-btn q14" onclick="q14('e', this)"><span class="choice-label">E</span>思い出すだけで消えたくなる</button>
    </div>
  </div>

  <!-- Q15 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q15</span>
      <span class="q-text">急な誘いへの反応</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q15" onclick="q15('a', this)"><span class="choice-label">A</span>最高のノリで「行く行く！」</button>
      <button class="choice-btn q15" onclick="q15('b', this)"><span class="choice-label">B</span>スケジュールを確認して決める</button>
      <button class="choice-btn q15" onclick="q15('c', this)"><span class="choice-label">C</span>その時の気分が乗れば行く</button>
      <button class="choice-btn q15" onclick="q15('d', this)"><span class="choice-label">D</span>正直面倒。断る理由を探しがち</button>
      <button class="choice-btn q15" onclick="q15('e', this)"><span class="choice-label">E</span>100%断る。家が一番安全</button>
    </div>
  </div>

  <!-- Q16 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q16</span>
      <span class="q-text">集団の中のポジション</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q16" onclick="q16('a', this)"><span class="choice-label">A</span>みんなを引っ張るリーダー役</button>
      <button class="choice-btn q16" onclick="q16('b', this)"><span class="choice-label">B</span>必要な時はサッと動くサポート役</button>
      <button class="choice-btn q16" onclick="q16('c', this)"><span class="choice-label">C</span>周りの空気に合わせる調和型</button>
      <button class="choice-btn q16" onclick="q16('d', this)"><span class="choice-label">D</span>存在感を消して、目立たず過ごす</button>
      <button class="choice-btn q16" onclick="q16('e', this)"><span class="choice-label">E</span>もはや空気。誰にも干渉されたくない</button>
    </div>
  </div>

  <!-- Q17 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q17</span>
      <span class="q-text">恋愛での距離感</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q17" onclick="q17('a', this)"><span class="choice-label">A</span>自分からガンガン距離を詰める</button>
      <button class="choice-btn q17" onclick="q17('b', this)"><span class="choice-label">B</span>少しずつ時間をかけて仲良くなる</button>
      <button class="choice-btn q17" onclick="q17('c', this)"><span class="choice-label">C</span>相手から来るのをじっと待つ</button>
      <button class="choice-btn q17" onclick="q17('d', this)"><span class="choice-label">D</span>好きな気持ちを必死に隠す</button>
      <button class="choice-btn q17" onclick="q17('e', this)"><span class="choice-label">E</span>恋愛モードになれず、鉄壁の守り</button>
    </div>
  </div>

  <!-- Q18 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q18</span>
      <span class="q-text">継続力</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q18" onclick="q18('a', this)"><span class="choice-label">A</span>決めた習慣は毎日欠かさず継続</button>
      <button class="choice-btn q18" onclick="q18('b', this)"><span class="choice-label">B</span>たまにさぼるけど、長く続く</button>
      <button class="choice-btn q18" onclick="q18('c', this)"><span class="choice-label">C</span>短期間なら驚異的な集中力を発揮</button>
      <button class="choice-btn q18" onclick="q18('d', this)"><span class="choice-label">D</span>典型的な「三日坊主」になりがち</button>
      <button class="choice-btn q18" onclick="q18('e', this)"><span class="choice-label">E</span>続けることが世界で一番苦手</button>
    </div>
  </div>

  <!-- Q19 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q19</span>
      <span class="q-text">自分を動物に例えると？</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q19" onclick="q19('a', this)"><span class="choice-label">A</span>常に走り回る「猟犬」タイプ</button>
      <button class="choice-btn q19" onclick="q19('b', this)"><span class="choice-label">B</span>虎視眈々と狙う「猛禽類」タイプ</button>
      <button class="choice-btn q19" onclick="q19('c', this)"><span class="choice-label">C</span>気ままに過ごす「猫」タイプ</button>
      <button class="choice-btn q19" onclick="q19('d', this)"><span class="choice-label">D</span>周りを気にする「うさぎ」タイプ</button>
      <button class="choice-btn q19" onclick="q19('e', this)"><span class="choice-label">E</span>最小限しか動かない「ナマケモノ」タイプ</button>
    </div>
  </div>

  <!-- Q20 -->
  <div class="q-card">
    <div class="q-header">
      <span class="q-num">Q20</span>
      <span class="q-text">部屋のコンディション</span>
    </div>
    <div class="q-choices">
      <button class="choice-btn q20" onclick="q20('a', this)"><span class="choice-label">A</span>モデルルーム並みにピカピカ</button>
      <button class="choice-btn q20" onclick="q20('b', this)"><span class="choice-label">B</span>生活感はあるが、片付いている</button>
      <button class="choice-btn q20" onclick="q20('c', this)"><span class="choice-label">C</span>来客があれば、秒速で片づけられる</button>
      <button class="choice-btn q20" onclick="q20('d', this)"><span class="choice-label">D</span>ものが多くて、だいたい散らかっている</button>
      <button class="choice-btn q20" onclick="q20('e', this)"><span class="choice-label">E</span>足の踏み場がない。もはや樹海</button>
    </div>
  </div>

  <div class="next-wrap">
    <button class="next-btn" onclick="nextQuestion2()">次のページへ →</button>
    <span class="back-link" onclick="befQuestion1()">← 前のページに戻る</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
