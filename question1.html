<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Question</title>
</head>

<body>

  <h1>Q1</h1>

  <p>
    朝の目覚め
  </p>

  <button class="q1" onclick="q1('a', this)">目覚めた瞬間、即行動！</button>
  <button class="q1" onclick="q1('b', this)">少しだけ布団でまどろむ</button>
  <button class="q1" onclick="q1('c', this)">魂が戻るまでスマホを見る</button>
  <button class="q1" onclick="q1('d', this)">ギリギリまで粘って爆速準備</button>
  <button class="q1" onclick="q1('e', this)">二度寝の誘惑に勝てない</button>


  <h1>Q2</h1>

  <p>
    やるべきことがあるのに、気分が乗らない
  </p>

  <button class="q2" onclick="q2('a', this)">無心で「とりあえず」始める</button>
  <button class="q2" onclick="q2('b', this)">好きなことで気分を上げてから</button>
  <button class="q2" onclick="q2('c', this)">〆切が迫るまでじっと待つ</button>
  <button class="q2" onclick="q2('d', this)">「明日やる」と言って一日終わる</button>
  <button class="q2" onclick="q2('e', this)">現実逃避で別の掃除とかしちゃう</button>


  <h1>Q3</h1>

  <p>
    最近のハマり具合
  </p>

  <button class="q3" onclick="q3('a', this)">寝食を忘れて、ガチ沼へ</button>
  <button class="q3" onclick="q3('b', this)">生活の一部になるくらい</button>
  <button class="q3" onclick="q3('c', this)">広く浅く、ライトに楽しむ</button>
  <button class="q3" onclick="q3('d', this)">三日坊主で、すぐ覚める</button>
  <button class="q3" onclick="q3('e', this)">特に何も。常にフラット</button>


  <h1>Q4</h1>

  <p>
    スマホとの距離感
  </p>

  <button class="q4" onclick="q4('a', this)">決めた時間しか触らない</button>
  <button class="q4" onclick="q4('b', this)">必要な時だけスマートに</button>
  <button class="q4" onclick="q4('c', this)">無意識にスワイプしてる</button>
  <button class="q4" onclick="q4('d', this)">気づくと数時間溶けてる</button>
  <button class="q4" onclick="q4('e', this)">スマホがないと生きていけない</button>


  <h1>Q5</h1>

  <p>
    友達との付き合い方
  </p>

  <button class="q5" onclick="q5('a', this)">賑やかなグループでワイワイ</button>
  <button class="q5" onclick="q5('b', this)">信頼できる数人と深く</button>
  <button class="q5" onclick="q5('c', this)">付かず離れず。ほどよく</button>
  <button class="q5" onclick="q5('d', this)">狭く静かな関係が落ち着く</button>
  <button class="q5" onclick="q5('e', this)">一人の時間が一番のご褒美</button>


  <h1>Q6</h1>

  <p>
    好きな人ができたら
  </p>

  <button class="q6" onclick="q6('a', this)">自分から積極的に話しかける</button>
  <button class="q6" onclick="q6('b', this)">共通点を探して徐々に接近</button>
  <button class="q6" onclick="q6('c', this)">相手が来るのをじっと待つ</button>
  <button class="q6" onclick="q6('d', this)">見ているだけで満足しちゃう</button>
  <button class="q6" onclick="q6('e', this)">目が合うと全力で逃げる</button>


  <h1>Q7</h1>

  <p>
    タスクへの取り組み
  </p>

  <button class="q7" onclick="q7('a', this)">出された瞬間に速攻終わらせる</button>
  <button class="q7" onclick="q7('b', this)">逆算して計画的に進める</button>
  <button class="q7" onclick="q7('c', this)">ギリギリの追い込みに賭ける</button>
  <button class="q7" onclick="q7('d', this)">溜めすぎて山積みになる</button>
  <button class="q7" onclick="q7('e', this)">存在を忘れて放置しがち</button>


  <h1>Q8</h1>

  <p>
    メンタル（心の天気）
  </p>

  <button class="q8" onclick="q8('a', this)">基本快晴！何があっても平気</button>
  <button class="q8" onclick="q8('b', this)">多少の雨でも、寝れば治る</button>
  <button class="q8" onclick="q8('c', this)">穏やかな曇り。良くも悪くもない</button>
  <button class="q8" onclick="q8('d', this)">些細なことで落ち込みやすい</button>
  <button class="q8" onclick="q8('e', this)">感情の起伏が激しい台風タイプ</button>


  <h1>Q9</h1>

  <p>
    将来への意識
  </p>

  <button class="q9" onclick="q9('a', this)">明確な目標。地図は完成済み</button>
  <button class="q9" onclick="q9('b', this)">「こうなりたい」理想はある</button>
  <button class="q9" onclick="q9('c', this)">未定。今やりたいこと探し中</button>
  <button class="q9" onclick="q9('d', this)">不安だから考えないようにしてる</button>
  <button class="q9" onclick="q9('e', this)">興味なし！今が楽しければOK</button>


  <h1>Q10</h1>

  <p>
    人間関係のスタイル
  </p>

  <button class="q10" onclick="q10('a', this)">全人類が友達候補！誰とでも</button>
  <button class="q10" onclick="q10('b', this)">仲良くなれば驚くほど喋る</button>
  <button class="q10" onclick="q10('c', this)">当たり障りなく、平和に接する</button>
  <button class="q10" onclick="q10('d', this)">特定の数人以外とは話さない</button>
  <button class="q10" onclick="q10('e', this)">他人とのかかわりは最小限でいい</button>

  <script src="script.js"></script>

</body>
