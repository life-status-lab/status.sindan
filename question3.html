  <style>
    :root {
      --yellow:#FFE54C; --pink:#FF6BB5; --blue:#4CC9FF; --green:#4CFFA0;
      --orange:#FF8C42; --purple:#C97BFF; --bg:#FFF8EC; --ink:#1A1A2E;
      --card:#FFFFFF; --border:3px solid var(--ink); --shadow:5px 5px 0px var(--ink); --radius:20px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background-color:var(--bg);
      background-image:radial-gradient(circle,#FFE54C44 1px,transparent 1px),radial-gradient(circle,#FF6BB522 1px,transparent 1px);
      background-size:32px 32px,16px 16px; background-position:0 0,8px 8px;
      font-family:'Zen Maru Gothic',sans-serif; color:var(--ink);
      min-height:100vh; padding:24px 16px 80px;
    }
    .progress-wrap{max-width:480px;margin:0 auto 24px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
    .progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .progress-label .pg-title{font-family:'Dela Gothic One',sans-serif;font-size:13px;}
    .progress-label .pg-num{font-size:12px;font-weight:700;background:var(--ink);color:var(--yellow);padding:2px 10px;border-radius:99px;}
    .progress-track{height:10px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden;}
    .progress-fill{height:100%;width:99%;background:linear-gradient(90deg,var(--pink),var(--orange));border-radius:99px;}
    .q-card{max-width:480px;margin:0 auto 20px;background:var(--card);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;}
    .q-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:var(--border);background:var(--green);}
    .q-num{font-family:'Dela Gothic One',sans-serif;font-size:22px;line-height:1;flex-shrink:0;}
    .q-text{font-size:15px;font-weight:700;line-height:1.4;}
    .q-choices{padding:12px;display:flex;flex-direction:column;gap:8px;}
    .choice-btn{
      width:100%;text-align:left;font-family:'Zen Maru Gothic',sans-serif;
      font-size:14px;font-weight:500;padding:12px 16px;background:var(--bg);
      border:2px solid var(--ink);border-radius:12px;cursor:pointer;
      transition:transform .1s,box-shadow .1s,background .1s;
      box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;gap:10px;
    }
    .choice-btn .choice-label{
      font-family:'Dela Gothic One',sans-serif;font-size:11px;background:var(--ink);color:var(--yellow);
      width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .choice-btn:hover{background:#fff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
    .choice-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
    .choice-btn.selected{background:var(--green);box-shadow:3px 3px 0 var(--ink);}
    .choice-btn.selected .choice-label{background:var(--ink);color:var(--green);}
    .next-wrap{max-width:480px;margin:8px auto 0;animation:popIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;}
    .result-btn{
      display:block;width:100%;font-family:'Dela Gothic One',sans-serif;font-size:17px;
      text-align:center;padding:15px;background:var(--orange);color:#fff;
      border:var(--border);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;
      transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden;
    }
    .result-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
    .back-link{display:block;text-align:center;margin-top:14px;font-size:13px;font-weight:700;color:#888;cursor:pointer;text-decoration:underline;}
    @keyframes popIn{from{opacity:0;transform:scale(.88) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
  </style>
</head>
