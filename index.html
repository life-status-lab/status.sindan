<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STATUS診断</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFE54C;
      --pink:   #FF6BB5;
      --blue:   #4CC9FF;
      --green:  #4CFFA0;
      --orange: #FF8C42;
      --purple: #C97BFF;
      --bg:     #FFF8EC;
      --ink:    #1A1A2E;
      --card:   #FFFFFF;
      --border: 3px solid var(--ink);
      --shadow: 5px 5px 0px var(--ink);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, #FFE54C44 1px, transparent 1px),
        radial-gradient(circle, #FF6BB522 1px, transparent 1px);
      background-size: 32px 32px, 16px 16px;
      background-position: 0 0, 8px 8px;
      font-family: 'Zen Maru Gothic', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .deco {
      position: fixed;
      font-size: 28px;
      opacity: .18;
      pointer-events: none;
      animation: floatDeco linear infinite;
    }
    .deco:nth-child(1)  { top: 8%;  left: 6%;  animation-duration: 6s;   animation-delay: 0s; }
    .deco:nth-child(2)  { top: 15%; right: 8%; animation-duration: 7s;   animation-delay: -2s; }
    .deco:nth-child(3)  { top: 55%; left: 4%;  animation-duration: 8s;   animation-delay: -1s; }
    .deco:nth-child(4)  { top: 70%; right: 5%; animation-duration: 5.5s; animation-delay: -3s; }
    .deco:nth-child(5)  { top: 40%; left: 88%; animation-duration: 9s;   animation-delay: -0.5s; }
    .deco:nth-child(6)  { top: 85%; left: 12%; animation-duration: 6.5s; animation-delay: -4s; }

    /* ---- main card ---- */
    .main-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: popIn .55s cubic-bezier(.34,1.56,.64,1) both;
    }

    .card-banner {
      background: var(--yellow);
      border-bottom: var(--border);
      padding: 24px 28px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card-banner::before {
      content: '★';
      position: absolute;
      font-size: 80px;
      opacity: .08;
      top: -10px; right: -10px;
      line-height: 1;
    }
    .card-banner::after {
      content: '◆';
      position: absolute;
      font-size: 60px;
      opacity: .08;
      bottom: -14px; left: 8px;
      line-height: 1;
    }
    .badge {
      display: inline-block;
      background: var(--ink);
      color: var(--yellow);
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 11px;
      letter-spacing: .18em;
      padding: 3px 14px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .card-banner h1 {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: clamp(28px, 8vw, 46px);
      line-height: 1.05;
      position: relative;
    }
    .card-banner h1 span {
      display: inline-block;
      background: var(--ink);
      color: var(--yellow);
      padding: 0 10px;
      border-radius: 8px;
    }
    .card-banner .subtitle {
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
      opacity: .7;
    }

    /* ---- card body ---- */
    .card-body {
      padding: 22px 24px 20px;
    }
    .catch {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.85;
      margin-bottom: 16px;
      text-align: center;
    }
    .catch em {
      font-style: normal;
      background: var(--yellow);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* ---- 偏差値説明ブロック ---- */
    .hensachi-preview {
      background: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: popIn .58s .06s cubic-bezier(.34,1.56,.64,1) both;
    }
    .hensachi-icon {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 36px;
      color: var(--yellow);
      line-height: 1;
      flex-shrink: 0;
    }
    .hensachi-text {
      color: #fff;
    }
    .hensachi-text strong {
      display: block;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 4px;
    }
    .hensachi-text p {
      font-size: 12px;
      line-height: 1.7;
      opacity: .85;
    }

    /* ---- info chips ---- */
    .info-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border: 2px solid var(--ink);
      border-radius: 99px;
      background: var(--bg);
    }
    .chip.pink   { background: #FFE0EE; }
    .chip.blue   { background: #D0EDFF; }
    .chip.green  { background: #C8FFE4; }
    .chip.yellow { background: var(--yellow); }

    /* ---- start button ---- */
    .start-btn {
      display: block;
      width: 100%;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 18px;
      text-align: center;
      padding: 16px;
      background: var(--pink);
      color: #fff;
      border: var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      transition: transform .1s, box-shadow .1s;
      position: relative;
      overflow: hidden;
      animation: popIn .6s .14s cubic-bezier(.34,1.56,.64,1) both;
    }
    .start-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .5s;
    }
    .start-btn:hover::after { transform: translateX(100%); }
    .start-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 14px;
      animation: popIn .65s .2s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.85) translateY(20px); }
      to   { opacity: 1; transform: scale(1)   translateY(0);    }
    }
    @keyframes floatDeco {
      0%,100% { transform: translateY(0)    rotate(0deg);   }
      50%      { transform: translateY(-18px) rotate(15deg); }
    }
  </style>
</head>
<body>

  <div class="deco">⚡</div>
  <div class="deco">★</div>
  <div class="deco">◆</div>
  <div class="deco">♥</div>
  <div class="deco">●</div>
  <div class="deco">▲</div>

  <div class="main-card">
    <div class="card-banner">
      <div class="badge">✦ CHARACTER DIAGNOSIS ✦</div>
      <h1>STATUS<br><span>診断</span></h1>
      <p class="subtitle">あなたの人生偏差値、測ります。</p>
    </div>

    <div class="card-body">
      <p class="catch">
        行動力・感情・コミュ力・知性・経験値…<br>
        5つのステータスから<em>キャラ診断</em>と<br>
        <em>人生偏差値</em>を算出します！
      </p>

      <!-- 偏差値説明 -->
      <div class="hensachi-preview">
        <div class="hensachi-icon">📊</div>
        <div class="hensachi-text">
          <strong>人生偏差値とは？</strong>
          <p>あなたの回答を10万人分のシミュレーションデータと比較して、本物の偏差値として算出します。平均は50。あなたは何点？</p>
        </div>
      </div>

      <div class="info-chips">
        <div class="chip pink">🧩 全30問</div>
        <div class="chip blue">⏱ 約5分</div>
        <div class="chip green">🎁 15種類のキャラ</div>
        <div class="chip yellow">📊 偏差値診断</div>
      </div>

      <button class="start-btn" onclick="startDiagnosis()">
        診断スタート →
      </button>
    </div>
  </div>

  <p class="note">※ 途中で戻ると最初からになります</p>

  <script src="./script.js"></script>
</body>
</html>
