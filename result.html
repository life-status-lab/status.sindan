<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFE54C;
      --pink:   #FF6BB5;
      --blue:   #4CC9FF;
      --green:  #4CFFA0;
      --orange: #FF8C42;
      --purple: #C97BFF;
      --bg:     #FFF8EC;
      --ink:    #1A1A2E;
      --card:   #FFFFFF;
      --border: 3px solid var(--ink);
      --shadow: 5px 5px 0px var(--ink);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, #FFE54C44 1px, transparent 1px),
        radial-gradient(circle, #FF6BB522 1px, transparent 1px);
      background-size: 32px 32px, 16px 16px;
      background-position: 0 0, 8px 8px;
      font-family: 'Zen Maru Gothic', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* ---- header ---- */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .page-header .label {
      display: inline-block;
      background: var(--ink);
      color: var(--yellow);
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .page-header h1 {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1.1;
    }

    /* ---- result card ---- */
    .result-card {
      max-width: 480px;
      margin: 0 auto 28px;
      background: var(--card);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }

    .card-top {
      background: var(--yellow);
      border-bottom: var(--border);
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .type-badge {
      background: var(--ink);
      color: var(--yellow);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .card-top .chara-type-label {
      font-size: 13px;
      font-weight: 700;
      opacity: .6;
    }

    .card-img {
      border-bottom: var(--border);
      background: linear-gradient(135deg, #ffe0f0 0%, #e0f4ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }
    .card-img::before {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      background: var(--yellow);
      border-radius: 50%;
      opacity: .25;
      top: -60px; right: -40px;
    }
    .card-img::after {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      background: var(--pink);
      border-radius: 50%;
      opacity: .18;
      bottom: -30px; left: -20px;
    }
    .card-img img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.15));
      animation: float 3s ease-in-out infinite;
    }
    .card-img .img-placeholder {
      width: 160px; height: 160px;
      border: 3px dashed #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      z-index: 1;
      animation: float 3s ease-in-out infinite;
    }

    .card-body {
      padding: 24px;
    }
    .chara-name {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: clamp(36px, 9vw, 54px);
      line-height: 1;
      margin-bottom: 6px;
      /* キャラごとに色を変える */
    }
    .chara-type {
      font-size: 15px;
      font-weight: 700;
      color: var(--pink);
      margin-bottom: 16px;
    }
    .chara-desc {
      font-size: 14px;
      line-height: 1.85;
      color: #444;
      background: var(--bg);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 14px 16px;
    }

    /* ---- stats bar ---- */
    .stats {
      max-width: 480px;
      margin: 0 auto 28px;
      background: var(--card);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      animation: popIn .55s .08s cubic-bezier(.34,1.56,.64,1) both;
    }
    .stats h2 {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 700;
      width: 60px;
      flex-shrink: 0;
    }
    .stat-track {
      flex: 1;
      height: 14px;
      background: #eee;
      border: 2px solid var(--ink);
      border-radius: 99px;
      overflow: hidden;
    }
    .stat-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .8s cubic-bezier(.34,1.2,.64,1);
      width: 0;
    }
    .stat-val {
      font-size: 12px;
      font-weight: 700;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ---- share ---- */
    .share-section {
      max-width: 480px;
      margin: 0 auto 28px;
      animation: popIn .6s .16s cubic-bezier(.34,1.56,.64,1) both;
    }
    .share-section h2 {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 16px;
      text-align: center;
      margin-bottom: 14px;
    }
    .share-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 13px;
      padding: 10px 22px;
      border: var(--border);
      border-radius: 99px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      transition: transform .1s, box-shadow .1s;
    }
    .share-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .share-btn.x-btn   { background: #1A1A2E; color: #fff; }
    .share-btn.line-btn { background: #06C755; }
    .share-btn.copy-btn { background: var(--yellow); }
 .share-btn.insta-btn {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
    /* ---- retry ---- */
    .retry-wrap {
      text-align: center;
      animation: popIn .65s .22s cubic-bezier(.34,1.56,.64,1) both;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 15px;
      padding: 14px 36px;
      background: var(--pink);
      color: #fff;
      border: var(--border);
      border-radius: 99px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      transition: transform .1s, box-shadow .1s;
    }
    .retry-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* ---- confetti ---- */
    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      top: -10px;
      animation: fall linear forwards;
    }

    /* ---- animations ---- */
    @keyframes popIn {
      from { opacity:0; transform: scale(.85) translateY(20px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ---- キャラ別アクセントカラー ---- */
    .accent-チャレン  { color: #FF6BB5; }
    .accent-フレア    { color: #FF8C42; }
    .accent-ラッシュ  { color: #FF3B3B; }
    .accent-ヨルミー  { color: #6B7FFF; }
    .accent-ユラ      { color: #C97BFF; }
    .accent-ヤミィ    { color: #5A3FA0; }
    .accent-キュルン  { color: #FF9EC4; }
    .accent-ポカリン  { color: #FFB800; }
    .accent-ミナモ    { color: #4CBFFF; }
    .accent-ツムリィ  { color: #7BC47B; }
    .accent-ロギ      { color: #4CFFA0; }
    .accent-ノート    { color: #A0C4FF; }
    .accent-キョロリ  { color: #FF8C42; }
    .accent-ワンダ    { color: #FF6BB5; }
    .accent-ハコベ    { color: #C97BFF; }

    .bg-チャレン  { background: #FFE0EE; }
    .bg-フレア    { background: #FFE8D6; }
    .bg-ラッシュ  { background: #FFD6D6; }
    .bg-ヨルミー  { background: #D6DCFF; }
    .bg-ユラ      { background: #EDD6FF; }
    .bg-ヤミィ    { background: #D4CAEE; }
    .bg-キュルン  { background: #FFD6E8; }
    .bg-ポカリン  { background: #FFF0B3; }
    .bg-ミナモ    { background: #D0EDFF; }
    .bg-ツムリィ  { background: #D6EED6; }
    .bg-ロギ      { background: #C8FFE4; }
    .bg-ノート    { background: #D6E8FF; }
    .bg-キョロリ  { background: #FFE8D6; }
    .bg-ワンダ    { background: #FFE0EE; }
    .bg-ハコベ    { background: #EDD6FF; }
  </style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<div class="page-header">
  <div class="label">✦ RESULT ✦</div>
  <h1>あなたは<br>このキャラ！</h1>

  <div class="stat-row">

    <div class="stat-track"><div class="stat-fill" id="bar-exp" style="background:#FFB800"></div></div>
    <span class="stat-val" id="val-exp">0</span>
  </div>
</div>

    "ハコベ": {
      img:  "chara.png",
      desc: "好きなものをひたすら集め、丁寧にコレクションしていく収集家。量より質、広さより深さ。こだわりのコレクションには確かな審美眼が光ってる。その情熱、本物のマニアの証！",
      emoji: "📦"
    },
  };

  /* ================================================
     スコアをバーに表示（最大50点を100%として計算）
  ================================================ */
  function renderBar(id, valId, score) {
    const MAX = 50;
    const pct = Math.max(0, Math.min(100, ((score + MAX) / (MAX * 2)) * 100));
    setTimeout(() => {
      document.getElementById(id).style.width = pct + "%";
    }, 200);
    document.getElementById(valId).textContent = score;
  }

  /* ================================================
     コピー機能
  ================================================ */
  function copyResult() {
    const result = diagnoseCharacter();
    const text = `🎉 キャラ診断結果 🎉\n私は「${result.name}」（${result.type}）でした！\nあなたも試してみて！ → [URL]`;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => { btn.textContent = '📋 コピー'; }, 2000);
    });
  }

  /* ================================================
     コンフェッティ
  ================================================ */
  function launchConfetti() {
    const colors = ['#FFE54C','#FF6BB5','#4CC9FF','#4CFFA0','#C97BFF','#FF8C42'];
    const shapes = ['◆','★','●','▲','♥'];
    const container = document.getElementById('confetti');
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.fontSize = (Math.random() * 10 + 8) + 'px';
      el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      el.style.animationDelay = (Math.random() * 1.2) + 's';
      container.appendChild(el);
    }
    setTimeout(() => { container.innerHTML = ''; }, 4000);
  }

  /* ================================================
     メイン：診断結果を表示
  ================================================ */
  window.addEventListener('DOMContentLoaded', () => {
    const result = diagnoseCharacter();
    const data = CHARA_DATA[result.name] || {
      img: "chara.png", desc: "謎に包まれたキャラクター…！", emoji: "❓"
    };

    // キャラ名・タイプ
    const nameEl = document.getElementById('chara-name');
    nameEl.textContent = result.name;
    nameEl.className = 'chara-name accent-' + result.name;

    document.getElementById('chara-type').textContent = result.type;
    document.getElementById('type-badge').textContent = result.type;
    document.getElementById('chara-desc').textContent = data.desc;

    // カード上部の背景色
    document.getElementById('card-top').className = 'card-top bg-' + result.name;

    // 画像
    const img = document.getElementById('chara-img');
    img.src = data.img;
    img.alt = result.name;

    // スコアバー
    renderBar('bar-speed', 'val-speed', speed);
    renderBar('bar-mental', 'val-mental', mental);
    renderBar('bar-comm',   'val-comm',  communication);
    renderBar('bar-intel',  'val-intel', intelligence);
    renderBar('bar-exp',    'val-exp',   experience);

    // シェアテキスト生成
    const shareText = encodeURIComponent(
      `🎉 キャラ診断結果！\n私は「${result.name}」（${result.type}）でした！\nあなたも試してみて！`
    );
    const shareUrl = encodeURIComponent(location.href);

    document.getElementById('share-x').href =
      `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`;
    document.getElementById('share-line').href =
      `https://social-plugins.line.me/lineit/share?url=${shareUrl}&text=${shareText}`;

    // コンフェッティ🎊
    launchConfetti();
  });
  function shareInstagram() {
  const result = diagnoseCharacter();
  const text = `私は「${result.name}」（${result.type}）でした！`;
  const url = `instagram-stories://share?source_application=your_app&backgroundTopColor=%23FFE54C&backgroundBottomColor=%23FF6BB5&caption=${encodeURIComponent(text)}`;
  window.location.href = url;

  // PCやインスタ未インストールの場合のフォールバック
  setTimeout(() => {
    if (document.visibilityState !== 'hidden') {
      alert('インスタアプリが見つかりませんでした。アプリからお試しください！');
    }
  }, 1500);
}
</script>
</body>
