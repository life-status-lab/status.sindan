<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow:#FFE54C; --pink:#FF6BB5; --blue:#4CC9FF; --green:#4CFFA0;
      --orange:#FF8C42; --purple:#C97BFF; --bg:#FFF8EC; --ink:#1A1A2E;
      --card:#FFFFFF; --border:3px solid var(--ink);
      --shadow:5px 5px 0px var(--ink); --radius:20px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background-color:var(--bg);
      background-image:radial-gradient(circle,#FFE54C44 1px,transparent 1px),radial-gradient(circle,#FF6BB522 1px,transparent 1px);
      background-size:32px 32px,16px 16px; background-position:0 0,8px 8px;
      font-family:'Zen Maru Gothic',sans-serif; color:var(--ink);
      min-height:100vh; padding:24px 16px 60px;
    }
    .page-header{text-align:center;margin-bottom:32px;}
    .page-header .label{
      display:inline-block; background:var(--ink); color:var(--yellow);
      font-family:'Dela Gothic One',sans-serif; font-size:12px; letter-spacing:.15em;
      padding:4px 14px; border-radius:99px; margin-bottom:10px;
    }
    .page-header h1{font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,7vw,48px);line-height:1.1;}
    .result-card{
      max-width:480px;margin:0 auto 28px;background:var(--card);
      border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
      overflow:hidden;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .card-top{
      background:var(--yellow);border-bottom:var(--border);
      padding:18px 24px 14px;display:flex;align-items:center;gap:10px;
    }
    .type-badge{background:var(--ink);color:var(--yellow);font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px;white-space:nowrap;}
    .card-top .chara-type-label{font-size:13px;font-weight:700;opacity:.6;}
    .card-img{
      border-bottom:var(--border);
      background:linear-gradient(135deg,#ffe0f0 0%,#e0f4ff 100%);
      display:flex;align-items:center;justify-content:center;
      padding:32px;min-height:280px;position:relative;overflow:hidden;
    }
    .card-img::before{content:'';position:absolute;width:200px;height:200px;background:var(--yellow);border-radius:50%;opacity:.25;top:-60px;right:-40px;}
    .card-img::after{content:'';position:absolute;width:120px;height:120px;background:var(--pink);border-radius:50%;opacity:.18;bottom:-30px;left:-20px;}
    .shadow-ellipse{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      width:150px;height:22px;background:rgba(0,0,0,.12);border-radius:50%;filter:blur(8px);
      z-index:0;animation:shadowPulse 3s ease-in-out infinite;
    }
    .card-img img{
      width:240px;height:240px;object-fit:contain;position:relative;z-index:1;
      filter:drop-shadow(0 28px 18px rgba(0,0,0,.2)) drop-shadow(0 4px 6px rgba(0,0,0,.1));
      animation:charFloat 3s ease-in-out infinite, charEntrance .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    .sparkle{position:absolute;pointer-events:none;animation:sparklePop linear forwards;z-index:2;}
    .card-img .img-placeholder{
      width:160px;height:160px;border:3px dashed #ccc;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:48px;position:relative;z-index:1;animation:charFloat 3s ease-in-out infinite;
    }
    .card-body{padding:24px;}
    .chara-name{font-family:'Dela Gothic One',sans-serif;font-size:clamp(36px,9vw,54px);line-height:1;margin-bottom:6px;}
    .chara-type{font-size:15px;font-weight:700;color:var(--pink);margin-bottom:12px;}
    .chara-catchcopy{font-size:13px;font-weight:700;color:#666;margin-bottom:16px;line-height:1.6;border-left:3px solid var(--pink);padding-left:10px;}
    .chara-desc{font-size:14px;line-height:1.85;color:#444;background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
    .hensachi-wrap{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 18px;background:var(--ink);border:2px solid var(--ink);border-radius:12px;margin-bottom:14px;
    }
    .hensachi-label{font-size:13px;font-weight:700;color:var(--yellow);display:block;}
    .hensachi-rank{font-size:11px;color:#aaa;margin-top:2px;}
    .hensachi-source{font-size:10px;color:#666;margin-top:2px;}
    .hensachi-right{text-align:right;}
    .hensachi-num{font-family:'Dela Gothic One',sans-serif;font-size:40px;color:var(--yellow);line-height:1;}
    .hensachi-up{font-size:11px;color:#aaa;margin-top:4px;}
    .weakness-wrap{background:#FFF0F5;border:2px solid var(--pink);border-radius:12px;padding:12px 16px;margin-bottom:14px;}
    .weakness-title{font-size:11px;font-weight:700;color:var(--pink);margin-bottom:6px;}
    .weakness-text{font-size:13px;font-weight:700;line-height:1.6;color:var(--ink);}
    .compat-section{
      max-width:480px;margin:0 auto 28px;background:var(--card);
      border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:20px 24px;animation:popIn .52s .06s cubic-bezier(.34,1.56,.64,1) both;
    }
    .compat-section h2{font-family:'Dela Gothic One',sans-serif;font-size:16px;margin-bottom:16px;}
    .compat-row{display:flex;gap:12px;}
    .compat-card{flex:1;border:2px solid var(--ink);border-radius:14px;padding:14px;text-align:center;}
    .compat-card.good{background:#FFFDE7;}
    .compat-card.bad{background:#FFF0F5;}
    .compat-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px;margin-bottom:8px;display:inline-block;}
    .compat-card.good .compat-badge{background:var(--yellow);color:var(--ink);}
    .compat-card.bad .compat-badge{background:var(--pink);color:#fff;}
    .compat-name{font-family:'Dela Gothic One',sans-serif;font-size:20px;margin-bottom:4px;}
    .compat-sub{font-size:11px;color:#888;line-height:1.5;}
    .stats{
      max-width:480px;margin:0 auto 28px;background:var(--card);
      border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;
      animation:popIn .55s .08s cubic-bezier(.34,1.56,.64,1) both;
    }
    .stats h2{font-family:'Dela Gothic One',sans-serif;font-size:16px;margin-bottom:16px;}
    .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .stat-label{font-size:12px;font-weight:700;width:60px;flex-shrink:0;}
    .stat-track{flex:1;height:14px;background:#eee;border:2px solid var(--ink);border-radius:99px;overflow:hidden;}
    .stat-fill{height:100%;border-radius:99px;width:0;transition:width .8s cubic-bezier(.34,1.2,.64,1);}
    .stat-val{font-size:12px;font-weight:700;width:34px;text-align:right;flex-shrink:0;}
    .tips-section{
      max-width:480px;margin:0 auto 28px;background:var(--card);
      border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;
      animation:popIn .57s .1s cubic-bezier(.34,1.56,.64,1) both;
    }
    .tips-section h2{font-family:'Dela Gothic One',sans-serif;font-size:16px;margin-bottom:14px;}
    .tip-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #eee;}
    .tip-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
    .tip-icon{font-size:22px;flex-shrink:0;line-height:1.2;}
    .tip-stat{font-size:10px;font-weight:700;color:var(--pink);margin-bottom:2px;}
    .tip-text{font-size:13px;line-height:1.6;color:#333;}
    .share-section{max-width:480px;margin:0 auto 28px;animation:popIn .6s .16s cubic-bezier(.34,1.56,.64,1) both;}
    .share-section h2{font-family:'Dela Gothic One',sans-serif;font-size:16px;text-align:center;margin-bottom:14px;}
    .share-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .share-btn{
      display:inline-flex;align-items:center;gap:8px;
      font-family:'Dela Gothic One',sans-serif;font-size:13px;
      padding:10px 22px;border:var(--border);border-radius:99px;
      box-shadow:var(--shadow);cursor:pointer;text-decoration:none;
      color:var(--ink);transition:transform .1s,box-shadow .1s;
    }
    .share-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
    .share-btn.x-btn{background:#1A1A2E;color:#fff;}
    .share-btn.line-btn{background:#06C755;}
    .share-btn.copy-btn{background:var(--yellow);}
    .share-btn.insta-btn{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}
    .retry-wrap{text-align:center;animation:popIn .65s .22s cubic-bezier(.34,1.56,.64,1) both;}
    .retry-btn{
      display:inline-flex;align-items:center;gap:8px;
      font-family:'Dela Gothic One',sans-serif;font-size:15px;
      padding:14px 36px;background:var(--pink);color:#fff;
      border:var(--border);border-radius:99px;box-shadow:var(--shadow);
      cursor:pointer;text-decoration:none;transition:transform .1s,box-shadow .1s;
    }
    .retry-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
    .confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}
    .confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:fall linear forwards;}
    @keyframes popIn{from{opacity:0;transform:scale(.85) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
    @keyframes charFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
    @keyframes charEntrance{from{opacity:0;transform:scale(.6) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
    @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.7;}50%{transform:translateX(-50%) scaleX(.75);opacity:.3;}}
    @keyframes sparklePop{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}}
    @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
    .accent-チャレン{color:#FF6BB5;} .accent-フレア{color:#FF8C42;}
    .accent-ラッシュ{color:#FF3B3B;} .accent-ヨルミー{color:#6B7FFF;}
    .accent-ユラ{color:#C97BFF;}    .accent-ヤミィ{color:#5A3FA0;}
    .accent-キュルン{color:#FF9EC4;} .accent-ポカリン{color:#FFB800;}
    .accent-ミナモ{color:#4CBFFF;}  .accent-ツムリィ{color:#7BC47B;}
    .accent-ロギ{color:#4CFFA0;}    .accent-ノート{color:#A0C4FF;}
    .accent-キョロリ{color:#FF8C42;} .accent-ワンダ{color:#FF6BB5;}
    .accent-ハコベ{color:#C97BFF;}
    .bg-チャレン{background:#FFE0EE;} .bg-フレア{background:#FFE8D6;}
    .bg-ラッシュ{background:#FFD6D6;} .bg-ヨルミー{background:#D6DCFF;}
    .bg-ユラ{background:#EDD6FF;}    .bg-ヤミィ{background:#D4CAEE;}
    .bg-キュルン{background:#FFD6E8;} .bg-ポカリン{background:#FFF0B3;}
    .bg-ミナモ{background:#D0EDFF;}  .bg-ツムリィ{background:#D6EED6;}
    .bg-ロギ{background:#C8FFE4;}    .bg-ノート{background:#D6E8FF;}
    .bg-キョロリ{background:#FFE8D6;} .bg-ワンダ{background:#FFE0EE;}
    .bg-ハコベ{background:#EDD6FF;}
  </style>
</head>
<body>
<div class="confetti-container" id="confetti"></div>
<div class="page-header">
  <div class="label">✦ RESULT ✦</div>
  <h1>あなたは<br>このキャラ！</h1>
</div>
<div class="result-card" id="result-card">
  <div class="card-top" id="card-top">
    <span class="type-badge" id="type-badge">タイプ</span>
    <span class="chara-type-label">診断タイプ</span>
  </div>
  <div class="card-img" id="card-img">
    <div class="shadow-ellipse"></div>
    <img id="chara-img" src="" alt="キャラクター画像"
         onerror="this.style.display='none';document.getElementById('chara-emoji').style.display='flex';">
    <div class="img-placeholder" id="chara-emoji" style="display:none;">🌟</div>
  </div>
  <div class="card-body">
    <div class="chara-name" id="chara-name">???</div>
    <div class="chara-type" id="chara-type">タイプ読み込み中...</div>
    <div class="chara-catchcopy" id="chara-catchcopy">...</div>
    <div class="chara-desc" id="chara-desc">診断結果を読み込んでいます...</div>
    <div class="hensachi-wrap">
      <div class="hensachi-left">
        <span class="hensachi-label">📊 人生偏差値</span>
        <span class="hensachi-rank" id="hensachi-rank">---</span>
        <span class="hensachi-source" id="hensachi-source"></span>
      </div>
      <div class="hensachi-right">
        <div class="hensachi-num" id="hensachi-num">--</div>
        <div class="hensachi-up" id="hensachi-up"></div>
      </div>
    </div>
    <div class="weakness-wrap">
      <div class="weakness-title">⚠️ あなたの弱点</div>
      <div class="weakness-text" id="weakness-text">...</div>
    </div>
  </div>
</div>
<div class="compat-section">
  <h2>💫 あなたの相性</h2>
  <div class="compat-row">
    <div class="compat-card good">
      <div class="compat-badge">✦ 最高の相手</div>
      <div class="compat-name" id="compat-good-name">---</div>
      <div class="compat-sub" id="compat-good-sub">---</div>
    </div>
    <div class="compat-card bad">
      <div class="compat-badge">⚡ 天敵</div>
      <div class="compat-name" id="compat-bad-name">---</div>
      <div class="compat-sub" id="compat-bad-sub">---</div>
    </div>
  </div>
</div>
<div class="stats">
  <h2>📊 あなたのスコア</h2>
  <div class="stat-row">
    <span class="stat-label">行動力</span>
    <div class="stat-track"><div class="stat-fill" id="bar-speed" style="background:#FF6BB5"></div></div>
    <span class="stat-val" id="val-speed">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">感情</span>
    <div class="stat-track"><div class="stat-fill" id="bar-mental" style="background:#C97BFF"></div></div>
    <span class="stat-val" id="val-mental">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">コミュ力</span>
    <div class="stat-track"><div class="stat-fill" id="bar-comm" style="background:#4CC9FF"></div></div>
    <span class="stat-val" id="val-comm">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">知性</span>
    <div class="stat-track"><div class="stat-fill" id="bar-intel" style="background:#4CFFA0"></div></div>
    <span class="stat-val" id="val-intel">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">経験値</span>
    <div class="stat-track"><div class="stat-fill" id="bar-exp" style="background:#FFB800"></div></div>
    <span class="stat-val" id="val-exp">0</span>
  </div>
</div>
<div class="tips-section">
  <h2>🚀 偏差値アップ術</h2>
  <div id="tips-list"></div>
</div>
<div class="share-section">
  <h2>🎉 シェアしよう！</h2>
  <div class="share-buttons">
    <a class="share-btn x-btn" id="share-x" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.846L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      Xでシェア
    </a>
    <a class="share-btn line-btn" id="share-line" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.94 2 10.79c0 3.19 1.89 6 4.73 7.63-.21.76-.76 2.77-.87 3.2-.13.52.19.51.4.37.17-.1 2.68-1.82 3.77-2.56.64.09 1.3.14 1.97.14 5.52 0 10-3.94 10-8.79C22 5.94 17.52 2 12 2z"/></svg>
      LINEで送る
    </a>
    <button class="share-btn copy-btn" id="copy-btn" onclick="copyResult()">📋 コピー</button>
    <button class="share-btn insta-btn" onclick="shareInstagram()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.919-.058-1.265-.07-1.645-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      ストーリーでシェア
    </button>
  </div>
</div>
<div class="retry-wrap">
  <a class="retry-btn" href="index.html">🔄 もう一度診断する</a>
</div>


</body>
</html>
